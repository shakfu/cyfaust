[project]
name = "cyfaust"
version = "0.1.4"
description = "A Cython wrapper of the Faust interpreter and signal processing library with RtAudio support."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Shakeeb Alireza", email = "shakfu@users.noreply.github.com" }
]
maintainers = [
    { name = "Shakeeb Alireza", email = "shakfu@users.noreply.github.com" }
]
keywords = [
    "faust",
    "dsp",
    "audio",
    "signal-processing",
    "music",
    "sound",
    "synthesis",
    "cython",
    "rtaudio",
    "real-time"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]

[project.scripts]
cyfaust = "cyfaust.__main__:main"

[project.urls]
Homepage = "https://github.com/shakfu/cyfaust"
Repository = "https://github.com/shakfu/cyfaust"
Documentation = "https://shakfu.github.io/cyfaust/"
Issues = "https://github.com/shakfu/cyfaust/issues"
Changelog = "https://github.com/shakfu/cyfaust/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "numpy",
    "twine>=6.2.0",
    "delvewheel>=1.11.2; os_name == 'nt'",
    "delocate>=0.13.0; os_name == 'darwin'",
    "auditwheel>=6.6.0; os_name == 'linux'",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "ruff>=0.15.9",
    "mypy>=1.20.0",
]

[build-system]
requires = ["scikit-build-core", "cython"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/cyfaust"]
wheel.exclude = [
    "*.pxd",
    "*.pyx",
    "player.cpp",
    "gui_statics.cpp",
]
cmake.build-type = "Release"
sdist.exclude = [
    "build",
    "dist",
    ".venv",
    "*.egg-info",
]

[tool.scikit-build.cmake.define]
# These can be overridden via CMAKE_ARGS environment variable
# e.g., CMAKE_ARGS="-DSTATIC=OFF" uv sync  (for development)
# e.g., CMAKE_ARGS="-DLLVM=ON" uv sync     (for LLVM backend)
# Default to STATIC=ON for PyPI distribution (sdist/wheel builds)
STATIC = "ON"
# Backend selection: OFF=interpreter (default), ON=LLVM (JIT compilation)
# LLVM backend requires libfaustwithllvm.a (use: python scripts/manage.py setup --llvm)
LLVM = "OFF"
INCLUDE_SNDFILE = "ON"
# Linux audio backends
ALSA = "ON"
PULSE = "OFF"
JACK = "OFF"
# Windows audio backends
ASIO = "OFF"
WASAPI = "ON"
DSOUND = "OFF"

# ----------------------------------------------------------------------------
# cibuildwheel: builds the Linux wheels inside a manylinux_2_28 container
# (glibc 2.28) so they install on RHEL/Rocky/Alma 8+, Debian 10+, Ubuntu 18.04+,
# and Amazon Linux 2023 -- unlike a bare ubuntu-latest build (glibc 2.39), which
# only installs on distros from ~2024 on. macOS/Windows wheels are still built
# natively in CI (see cyfaust-release.yml), not through cibuildwheel.
# ----------------------------------------------------------------------------
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
build-frontend = "build"
# Smoke-test each built wheel; keep deps to none so it runs everywhere.
test-command = 'python -c "import cyfaust; from cyfaust import get_version; print(get_version())"'

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
environment = { CMAKE_ARGS = "-DSTATIC=ON" }
# Run once per container before building any wheel: install the audio dev
# libraries auditwheel will vendor into cyfaust.libs/ (libsndfile/libsamplerate/
# alsa, which pull in FLAC/ogg/vorbis/opus/mp3lame/mpg123), then build libfaust
# from source and generate the static-variant sources. manylinux_2_28 is
# AlmaLinux 8, so packages come from dnf/yum (libsndfile/samplerate via EPEL).
before-all = [
    "dnf -y install epel-release || yum -y install epel-release",
    "dnf -y install libsndfile-devel libsamplerate-devel alsa-lib-devel cmake git make gcc-c++ || yum -y install libsndfile-devel libsamplerate-devel alsa-lib-devel cmake git make gcc-c++",
    # Build libfaust only if the CI cache did not already restore it (manage.py
    # setup --faust is not idempotent -- it re-clones and rebuilds). The
    # build_linux_wheels job caches lib/static/libfaust.a across runs.
    "test -f lib/static/libfaust.a || python3 scripts/manage.py setup --faust",
    "python3 scripts/generate_static.py",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841", "F821", "E402", "E501", "W191", "W291", "W293"]

[tool.mypy]
exclude = ["src/static"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "src/static"]
